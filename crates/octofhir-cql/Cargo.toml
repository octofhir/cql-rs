[package]
name = "octofhir-cql"
description = "Clinical Quality Language (CQL) implementation for Rust"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "octofhir_cql"
path = "src/lib.rs"

[[bin]]
name = "cql"
path = "src/bin/main.rs"
required-features = ["cli"]

[dependencies]
octofhir-cql-ast = { workspace = true }
octofhir-cql-parser = { workspace = true }
octofhir-cql-elm = { workspace = true }
octofhir-cql-types = { workspace = true }
octofhir-cql-eval = { workspace = true }
octofhir-cql-model = { workspace = true }
octofhir-cql-diagnostics = { workspace = true }
indexmap = { workspace = true }

# CLI dependencies (feature `cli`)
anyhow = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
colored = { workspace = true, optional = true }
human-panic = { workspace = true, optional = true }
rustyline = { version = "13", optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[features]
default = ["cli"]
cli = [
    "anyhow",
    "chrono",
    "clap",
    "colored",
    "human-panic",
    "rustyline",
    "serde",
    "serde_json",
]

[dev-dependencies]
rstest = { workspace = true }
pretty_assertions = { workspace = true }
proptest = { workspace = true }
insta = { workspace = true }
tempfile = { workspace = true }
chrono = { workspace = true }
bigdecimal = "0.4"
num-traits = "0.2"
indexmap = { workspace = true }
async-trait = { workspace = true }
quick-xml = { workspace = true }
divan = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
regex = { workspace = true }

[[bench]]
name = "parser"
harness = false

[[bench]]
name = "evaluator"
harness = false

[lints]
workspace = true

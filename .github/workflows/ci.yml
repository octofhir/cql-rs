name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Format and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check library dependency graph
        run: |
          cargo check --locked -p octofhir-cql --lib --no-default-features
          python3 - <<'PY'
          import re
          import subprocess
          graph = subprocess.check_output([
              "cargo", "tree", "--locked", "-p", "octofhir-cql",
              "--no-default-features", "--edges", "normal,build",
              "--prefix", "none", "--format", "{p}",
          ], text=True)
          forbidden = re.findall(r"^(?:reqwest|hyper|rustls|native-tls|openssl-sys|fuzzy-matcher|thread_local) v.*", graph, re.M)
          if forbidden:
              raise SystemExit("Unexpected library transport/search dependencies: " + ", ".join(forbidden))
          PY
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace --all-features

  conformance:
    name: cqframework/cql-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Official CQL specification tests
        run: cargo test -p octofhir-cql --test cqframework_spec_tests -- --nocapture

  docs:
    name: Docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build docs
        run: cargo doc --workspace --no-deps --all-features
